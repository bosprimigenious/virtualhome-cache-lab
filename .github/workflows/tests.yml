name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m cachelab.acceptance --output-dir results/ci-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-python-${{ matrix.python }}
          path: results/ci-acceptance/
